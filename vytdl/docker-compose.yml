services:
  vytdl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vytdl
    # Go daemon (services/vytdl `serve`) + static frontend, single image.
    ports:
      - "3000:3000"
    volumes:
      - vytdl-downloads:/app/downloads
      - vytdl-data:/app/data
    environment:
      - VYTDL_OUTPUT_DIR=/app/downloads
    restart: unless-stopped
    # For NAS / Raspberry Pi: limit resources
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  vytdl-downloads:
    driver: local
  vytdl-data:
    driver: local
