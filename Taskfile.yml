version: "3"

vars:
  CLI_DIR: ./services/vytdl
  CONTENTFORGE_DIR: ./tools/contentforge-cli
  CLI_BIN: vYtDL
  CF_BIN: contentforge
  DIST_DIR: ./dist
  PYTHON: python3

tasks:
  # ── Default ──────────────────────────────────────────────
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ── Go CLI (vYtDL, monorepo working copy) ────────────────
  cli:build:
    desc: Build the Go CLI for the current platform
    dir: "{{.CLI_DIR}}"
    env:
      GOWORK: "off"
    cmds:
      - go build -trimpath -ldflags "-s -w" -o {{.CLI_BIN}} .
    sources:
      - "**/*.go"
    generates:
      - "{{.CLI_BIN}}"

  cli:build:all:
    desc: Cross-compile the Go CLI for macOS/Linux/Windows
    dir: "{{.CLI_DIR}}"
    env:
      GOWORK: "off"
    cmds:
      - mkdir -p {{.DIST_DIR}}
      - ./scripts/build.sh {{.DIST_DIR}} {{.CLI_BIN}}
    sources:
      - "**/*.go"

  cli:build:windows:
    desc: Cross-compile Windows amd64 + arm64 (.exe → services/vytdl/dist/)
    dir: "{{.CLI_DIR}}"
    env:
      GOWORK: "off"
      ONLY: windows
    cmds:
      - mkdir -p {{.DIST_DIR}}
      - ./scripts/build.sh {{.DIST_DIR}} {{.CLI_BIN}}
    sources:
      - "**/*.go"
    generates:
      - "{{.DIST_DIR}}/{{.CLI_BIN}}-windows-amd64.exe"
      - "{{.DIST_DIR}}/{{.CLI_BIN}}-windows-arm64.exe"

  cli:build:windows:amd64:
    desc: Cross-compile Windows amd64 only
    dir: "{{.CLI_DIR}}"
    env:
      GOWORK: "off"
      ONLY: windows/amd64
    cmds:
      - mkdir -p {{.DIST_DIR}}
      - ./scripts/build.sh {{.DIST_DIR}} {{.CLI_BIN}}
    generates:
      - "{{.DIST_DIR}}/{{.CLI_BIN}}-windows-amd64.exe"

  cli:build:windows:arm64:
    desc: Cross-compile Windows arm64 only
    dir: "{{.CLI_DIR}}"
    env:
      GOWORK: "off"
      ONLY: windows/arm64
    cmds:
      - mkdir -p {{.DIST_DIR}}
      - ./scripts/build.sh {{.DIST_DIR}} {{.CLI_BIN}}
    generates:
      - "{{.DIST_DIR}}/{{.CLI_BIN}}-windows-arm64.exe"

  cli:build:windows:embed:
    desc: Cross-compile Windows with yt-dlp embedded
    dir: "{{.CLI_DIR}}"
    env:
      GOWORK: "off"
      ONLY: windows
      EMBED: "1"
    cmds:
      - mkdir -p {{.DIST_DIR}}
      - ./scripts/build.sh {{.DIST_DIR}} {{.CLI_BIN}}
    sources:
      - "**/*.go"

  cli:run:
    desc: Run the Go CLI (pass args via CLI_ARGS)
    dir: "{{.CLI_DIR}}"
    env:
      GOWORK: "off"
    cmds:
      - go run . {{.CLI_ARGS | default "--help"}}

  cli:test:
    desc: Run Go CLI tests
    dir: "{{.CLI_DIR}}"
    env:
      GOWORK: "off"
    cmds:
      - go test ./...

  cli:install:
    desc: Install the Go CLI to $GOPATH/bin
    dir: "{{.CLI_DIR}}"
    env:
      GOWORK: "off"
    cmds:
      - go install -trimpath -ldflags "-s -w" .

  # ── Daemon (vytdl serve — refactor Sprint 1) ─────────────
  daemon:dev:
    desc: Run the vYtDL daemon locally (API+WS on a random loopback port)
    dir: "{{.CLI_DIR}}"
    env:
      GOWORK: "off"
    cmds:
      - go run . serve --dev --home ./.daemon-home

  daemon:build:
    desc: Build the daemon binary (services/vytdl/dist/vytdl)
    dir: "{{.CLI_DIR}}"
    env:
      GOWORK: "off"
    cmds:
      - go build -trimpath -ldflags "-s -w" -o dist/vytdl .
    sources:
      - "**/*.go"
    generates:
      - "dist/vytdl"

  daemon:test:
    desc: Run daemon + CLI Go tests
    dir: "{{.CLI_DIR}}"
    env:
      GOWORK: "off"
    cmds:
      - go test ./...

  # ── Shell (Electron host — refactor Sprint 2) ────────────
  shell:dev:
    desc: Stage resources (host daemon + web export) and launch the Electron shell
    cmds:
      - python3 scripts/build-shell-resources.py
      - pnpm --filter @vytdl/shell build
      - pnpm --filter @vytdl/shell start

  shell:test:
    desc: Run shell unit tests (terminal launcher, daemon helpers)
    cmds:
      - pnpm --filter @vytdl/shell test

  desktop:bundle:
    desc: Package the desktop app (electron-builder; mac arm64/x64 + win x64)
    cmds:
      - python3 scripts/build-shell-resources.py --all
      - pnpm --filter @vytdl/shell build
      - pnpm --filter @vytdl/shell exec electron-builder --config electron-builder.yml

  # ── ContentForge ──────────────────────────────────────────
  contentforge:env:
    desc: Load ContentForge environment (print instructions)
    cmds:
      - |
        echo "Run: source packages/contentforge-core/scripts/cf-env.sh"

  contentforge:build:
    desc: Build ContentForge Go CLI
    dir: "{{.CONTENTFORGE_DIR}}"
    cmds:
      - go build -trimpath -ldflags "-s -w" -o {{.CF_BIN}} .
    sources:
      - "**/*.go"
    generates:
      - "{{.CF_BIN}}"

  contentforge:check:
    desc: Verify ContentForge Python modules import
    cmds:
      - bash -c 'source packages/contentforge-core/scripts/cf-env.sh && python3 -c "import contentforge.models; print(\"contentforge.models OK\")"'

  contentforge:help:
    desc: Show ContentForge CLI help
    dir: "{{.CONTENTFORGE_DIR}}"
    deps: [contentforge:build]
    cmds:
      - ./{{.CF_BIN}} --help

  # ── Setup ────────────────────────────────────────────────
  setup:macos:
    desc: Run macOS environment setup (ContentForge venv, deps)
    cmds:
      - bash setup-macos.sh

  # ── Web (Docker) ─────────────────────────────────────────
  web:up:
    desc: Start Docker web UI
    cmds:
      - docker-compose up -d

  web:down:
    desc: Stop Docker web UI
    cmds:
      - docker-compose down

  web:logs:
    desc: Tail Docker web UI logs
    cmds:
      - docker-compose logs -f vytdl

  # ── Combined ─────────────────────────────────────────────
  build:
    desc: Build CLI + ContentForge production
    deps: [cli:build, contentforge:build]

  build:cli:
    desc: Build CLI + ContentForge only
    deps: [cli:build, contentforge:build]

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.DIST_DIR}}
      - rm -f {{.CLI_DIR}}/{{.CLI_BIN}}
      - rm -f {{.CONTENTFORGE_DIR}}/{{.CF_BIN}}
      - rm -rf apps/web/out
      - rm -rf apps/shell/dist
      - rm -rf apps/shell/resources
      - rm -rf apps/shell/release
      - echo "Cleaned."

  # ── Help ─────────────────────────────────────────────────
  help:
    desc: Show build and run hints
    cmds:
      - |
        echo ""
        echo "══════════════════════════════════════════════════"
        echo "  innate-keepthem — Task Build Guide"
        echo "══════════════════════════════════════════════════"
        echo ""
        echo "  Install Task:  brew install go-task"
        echo ""
        echo "  vYtDL CLI (canonical source services/vytdl/):"
        echo "    CLI source lives in services/vytdl (synced to qdriven/innate-vytdl via PR)"
        echo "    task cli:build"
        echo "    task cli:build:windows      # Windows amd64 + arm64"
        echo "    task cli:build:windows:amd64"
        echo "    task cli:run -- URL"
        echo ""
        echo "  Desktop (Electron shell):"
        echo "    task shell:dev            # stage resources + launch"
        echo "    task shell:test           # unit tests"
        echo "    task desktop:bundle       # electron-builder installers"
        echo ""
        echo "  ContentForge:"
        echo "    task setup:macos"
        echo "    task contentforge:build"
        echo "    source packages/contentforge-core/scripts/cf-env.sh"
        echo ""
        echo "  vYtDL CLI source (services/vytdl/):"
        echo "    cd services/vytdl && task build"
        echo ""
        echo "  Direct Python (still supported):"
        echo "    python3 scripts/build-desktop.py dev"
        echo ""
