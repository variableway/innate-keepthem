name: vytdl CI

on:
  push:
    branches: [main]
    paths:
      - "vytdl/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/vytdl.yml"
  pull_request:
    paths:
      - "vytdl/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/vytdl.yml"

concurrency:
  group: vytdl-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (vYtDL CLI + daemon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build & test (vytdl/services/vytdl)
        working-directory: vytdl/services/vytdl
        env:
          GOWORK: "off"
        run: |
          go build ./...
          go test ./...

  web:
    name: Node (workspace build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (workspace)
        run: pnpm run build
      - name: Plugin runtime tests
        run: pnpm --filter @vytdl/plugin-runtime test

  shell:
    name: Shell (Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build & test shell (tsc + vitest)
        run: |
          pnpm --filter @vytdl/shell build
          pnpm --filter @vytdl/shell test
