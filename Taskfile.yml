version: "3"

vars:
  CLI_DIR: ./tools/vytdl-cli
  DESKTOP_APP_DIR: ./apps/vytdl-desktop
  CONTENTFORGE_DIR: ./tools/contentforge-cli
  CLI_BIN: vYtDL
  CF_BIN: contentforge
  DIST_DIR: ./dist
  PYTHON: python3

tasks:
  # ── Default ──────────────────────────────────────────────
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ── Go CLI (vYtDL, monorepo working copy) ────────────────
  cli:build:
    desc: Build the Go CLI for the current platform
    dir: "{{.CLI_DIR}}"
    cmds:
      - go build -trimpath -ldflags "-s -w" -o {{.CLI_BIN}} .
    sources:
      - "**/*.go"
    generates:
      - "{{.CLI_BIN}}"

  cli:build:all:
    desc: Cross-compile the Go CLI for all platforms
    dir: "{{.CLI_DIR}}"
    cmds:
      - mkdir -p {{.DIST_DIR}}
      - |
        for pair in "darwin amd64" "darwin arm64" "linux amd64" "linux arm64" "windows amd64" "windows arm64"; do
          GOOS=$(echo $pair | cut -d' ' -f1)
          GOARCH=$(echo $pair | cut -d' ' -f2)
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          echo "Building {{.CLI_BIN}}-${GOOS}-${GOARCH}${EXT}"
          CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath -ldflags "-s -w" -o "{{.DIST_DIR}}/{{.CLI_BIN}}-${GOOS}-${GOARCH}${EXT}" .
        done
      - echo "Artifacts in {{.DIST_DIR}}/"

  cli:run:
    desc: Run the Go CLI (pass args via CLI_ARGS)
    dir: "{{.CLI_DIR}}"
    cmds:
      - go run . {{.CLI_ARGS | default "--help"}}

  cli:test:
    desc: Run Go CLI tests
    dir: "{{.CLI_DIR}}"
    cmds:
      - go test ./...

  cli:install:
    desc: Install the Go CLI to $GOPATH/bin
    dir: "{{.CLI_DIR}}"
    cmds:
      - go install -trimpath -ldflags "-s -w" .

  # ── Desktop App (Tauri, via Python scripts or direct pnpm) ─
  desktop:check:
    desc: Check desktop build dependencies (Node, pnpm, Rust)
    dir: "."
    cmds:
      - "{{.PYTHON}} scripts/build-desktop.py check"

  desktop:install:
    desc: Install workspace Node dependencies
    dir: "."
    cmds:
      - pnpm install

  desktop:yt-dlp:
    desc: Download yt-dlp binaries for production bundling
    dir: "."
    cmds:
      - "{{.PYTHON}} scripts/download-yt-dlp-binaries.py"

  desktop:cli:
    desc: Build tools/vytdl-cli and stage it as the desktop sidecar binary (bin/vYtDL-<triple>)
    dir: "."
    cmds:
      - "{{.PYTHON}} scripts/build-desktop.py cli"

  desktop:bootstrap-ytdlp:
    desc: Bootstrap yt-dlp dev resources from system PATH (fallback)
    dir: "."
    cmds:
      - bash scripts/bootstrap-ytdlp-dev.sh

  desktop:dev:
    desc: Start desktop app in development mode
    dir: "."
    deps: [desktop:bootstrap-ytdlp]
    cmds:
      - "{{.PYTHON}} scripts/build-desktop.py dev"

  desktop:dev:fast:
    desc: Start desktop dev mode (skip pnpm install)
    dir: "."
    deps: [desktop:bootstrap-ytdlp]
    cmds:
      - "{{.PYTHON}} scripts/build-desktop.py dev --skip-deps"

  desktop:build:
    desc: Build desktop app for production
    dir: "."
    deps: [desktop:yt-dlp]
    cmds:
      - "{{.PYTHON}} scripts/build-desktop.py build"

  desktop:bundle:
    desc: Build desktop app and create distributable package
    dir: "."
    deps: [desktop:yt-dlp]
    cmds:
      - "{{.PYTHON}} scripts/build-desktop.py bundle"

  # Direct Tauri passthrough (pnpm must run inside apps/vytdl-desktop,
  # where @tauri-apps/cli is installed). Requires the staged sidecar.
  desktop:tauri:dev:
    desc: Run Tauri dev server directly (skips the Python wrapper)
    dir: "{{.DESKTOP_APP_DIR}}"
    deps: [desktop:cli]
    cmds:
      - pnpm tauri dev

  desktop:tauri:build:
    desc: Build the Tauri app directly (skips the Python wrapper)
    dir: "{{.DESKTOP_APP_DIR}}"
    deps: [desktop:cli, desktop:yt-dlp]
    cmds:
      - pnpm tauri build

  # ── ContentForge (via Go CLI + Python core) ──────────────
  contentforge:env:
    desc: Load ContentForge environment (print instructions)
    cmds:
      - |
        echo "Run: source packages/contentforge-core/scripts/cf-env.sh"

  contentforge:build:
    desc: Build ContentForge Go CLI
    dir: "{{.CONTENTFORGE_DIR}}"
    cmds:
      - go build -trimpath -ldflags "-s -w" -o {{.CF_BIN}} .
    sources:
      - "**/*.go"
    generates:
      - "{{.CF_BIN}}"

  contentforge:check:
    desc: Verify ContentForge Python modules import
    cmds:
      - bash -c 'source packages/contentforge-core/scripts/cf-env.sh && python3 -c "import contentforge.models; print(\"contentforge.models OK\")"'

  contentforge:help:
    desc: Show ContentForge CLI help
    dir: "{{.CONTENTFORGE_DIR}}"
    deps: [contentforge:build]
    cmds:
      - ./{{.CF_BIN}} --help

  # ── Setup ────────────────────────────────────────────────
  setup:macos:
    desc: Run macOS environment setup (ContentForge venv, deps)
    cmds:
      - bash setup-macos.sh

  # ── Web (Docker) ─────────────────────────────────────────
  web:up:
    desc: Start Docker web UI
    cmds:
      - docker-compose up -d

  web:down:
    desc: Stop Docker web UI
    cmds:
      - docker-compose down

  web:logs:
    desc: Tail Docker web UI logs
    cmds:
      - docker-compose logs -f vytdl-web

  # ── Combined ─────────────────────────────────────────────
  build:
    desc: Build CLI + ContentForge + Desktop production
    deps: [cli:build, contentforge:build, desktop:build]

  build:cli:
    desc: Build CLI + ContentForge only
    deps: [cli:build, contentforge:build]

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.DIST_DIR}}
      - rm -f {{.CLI_DIR}}/{{.CLI_BIN}}
      - rm -f {{.CONTENTFORGE_DIR}}/{{.CF_BIN}}
      - rm -rf apps/vytdl-desktop/.next
      - rm -rf apps/vytdl-desktop/out
      - rm -rf apps/vytdl-desktop/src-tauri/target
      - echo "Cleaned."

  # ── Help ─────────────────────────────────────────────────
  help:
    desc: Show build and run hints
    cmds:
      - |
        echo ""
        echo "══════════════════════════════════════════════════"
        echo "  innate-keepthem — Task Build Guide"
        echo "══════════════════════════════════════════════════"
        echo ""
        echo "  Install Task:  brew install go-task"
        echo ""
        echo "  vYtDL CLI (monorepo copy):"
        echo "    task cli:build"
        echo "    task cli:run -- URL"
        echo ""
        echo "  Desktop:"
        echo "    task desktop:check"
        echo "    task desktop:dev          # dev mode"
        echo "    task desktop:build        # production"
        echo "    task desktop:bundle       # + installer"
        echo "    task desktop:tauri:build  # direct pnpm tauri build"
        echo ""
        echo "  ContentForge:"
        echo "    task setup:macos"
        echo "    task contentforge:build"
        echo "    source packages/contentforge-core/scripts/cf-env.sh"
        echo ""
        echo "  vYtDL CLI standalone repo (vYtDL-standalone/):"
        echo "    cd vYtDL-standalone && task build"
        echo ""
        echo "  Direct Python (still supported):"
        echo "    python3 scripts/build-desktop.py dev"
        echo ""
